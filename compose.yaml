services:
  postgres:
    image: postgres:17-alpine
    container_name: derma-nusantara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: derma-nusantara-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ADMIN_WHATSAPP: ${ADMIN_WHATSAPP}
      ANONYMOUS_LABEL: ${ANONYMOUS_LABEL:-Hamba Allah}
      UNIQUE_CODE_MIN: ${UNIQUE_CODE_MIN:-1}
      UNIQUE_CODE_MAX: ${UNIQUE_CODE_MAX:-999}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-local-admin-secret-change-me}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@dermanusantara.local}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-AdminLocal123!}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME:-Super Admin}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - admin_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
    name: derma-nusantara-postgres-data
  admin_uploads:
    name: derma-nusantara-admin-uploads
